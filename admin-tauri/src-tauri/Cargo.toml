[package]
name = "vyxtrader-admin-tauri"
version = "0.1.0"
edition = "2021"

# Not part of the engine/ Cargo workspace, and a deliberately separate
# project from desktop-tauri/ and manager-tauri/ -- see this app's own
# package.json description for why (each app is its own module by
# explicit project decision, not a shared codebase).
[workspace]

[[bin]]
name = "vyxtrader-admin-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", features = ["cookies", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# fix/realtime-sync -- see desktop-tauri/src-tauri/Cargo.toml's identical
# comment. Disables WebView2's default browser-like behavior via main.rs's
# lock_down_webview.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"
