[package]
name = "vyxtrader-desktop-tauri"
version = "0.1.10"
edition = "2021"

# Not part of the engine/ Cargo workspace -- this is an application shell
# around the deployed web app, not a Trading Core module. Keeping it out
# of engine/Cargo.toml's [workspace] avoids pulling desktop-app deps
# (webview/GTK/etc.) into every `cargo build` of the trading engine.
[workspace]

[[bin]]
name = "vyxtrader-desktop-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", features = ["cookies", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }

# fix/realtime-sync -- disables WebView2's default browser-like behavior
# (context menu, F5/Ctrl+R/F12 accelerator keys, DevTools) via the native
# COM controller Tauri's with_webview escape hatch exposes; see main.rs's
# lock_down_webview. Windows-only: no macOS/Linux build target exists for
# these apps today, and webview2-com itself only builds on Windows.
# Versions match what wry already resolves transitively (cargo tree -p
# webview2-com / -p windows), so this doesn't pull in a second copy.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"
