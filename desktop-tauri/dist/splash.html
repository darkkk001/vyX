<!doctype html>
<!--
  Direct port of desktop/screens/loading.html -- shown instantly (local,
  no network needed) while src-tauri/src/main.rs checks whether the
  broker's deployed WebTrader is reachable, then navigates the window
  away to either the real app or offline.html. window.vyxDesktop is
  injected on every page load including this local one (see main.rs's
  VYX_DESKTOP_INIT_SCRIPT), so minimize/close work unchanged.
-->
<html>
<head>
<meta charset="utf-8" />
<title>VyXTrader</title>
<style>
  html, body { height: 100%; margin: 0; background: #07090C; }
  body {
    display: flex; flex-direction: column;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    color: #e8ecf4;
  }
  .titlebar {
    -webkit-app-region: drag;
    height: 32px; flex-shrink: 0; display: flex; align-items: center;
    background: #0b0e14; border-bottom: 1px solid #1b2130; padding: 0 10px;
  }
  .titlebar button {
    -webkit-app-region: no-drag;
    width: 32px; height: 32px; margin-left: auto; background: transparent; border: none;
    color: #8891a6; cursor: pointer; font-size: 14px;
  }
  .titlebar button:hover { background: #1b2130; color: #e8ecf4; }
  .content {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .mark {
    width: 56px; height: 56px; border-radius: 12px; background: #16C784;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #07090C; margin-bottom: 18px;
  }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid #262e42; border-top-color: #16C784;
    animation: spin 0.8s linear infinite; margin-top: 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 12px; color: #8891a6; margin: 0; }
</style>
</head>
<body>
  <div class="titlebar">
    <button id="min" title="Minimize">–</button>
    <button id="close" title="Close">✕</button>
  </div>
  <div class="content">
    <div class="mark">V</div>
    <div class="spinner"></div>
    <p style="margin-top:12px;">Connecting…</p>
  </div>
  <script>
    if (window.vyxDesktop) {
      document.getElementById("min").onclick = window.vyxDesktop.minimize;
      document.getElementById("close").onclick = window.vyxDesktop.close;
    }
  </script>
</body>
</html>
