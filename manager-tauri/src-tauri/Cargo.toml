[package]
name = "vyxtrader-manager-tauri"
version = "0.1.7"
edition = "2021"

# Not part of the engine/ Cargo workspace, and a deliberately separate
# project from desktop-tauri/ and admin-tauri/ -- see this app's own
# package.json description for why (each app is its own module by
# explicit project decision, not a shared codebase).
[workspace]

[[bin]]
name = "vyxtrader-manager-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.13", features = ["cookies", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
