<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VyXTrader — WebTrader</title>
<style>
  :root {
    --bg-0: #0b0e14;
    --bg-1: #111621;
    --bg-2: #161c2b;
    --bg-3: #1d2434;
    --border: #262e42;
    --text-0: #e8ecf4;
    --text-1: #97a2c0;
    --text-2: #5c6788;
    --buy: #16c78d;
    --buy-dim: #0f3d31;
    --sell: #f0526a;
    --sell-dim: #401821;
    --accent: var(--brand-primary, #2f7dfb);
    --accent-dim: #14233f;
    --warn: #f0b429;
    --radius: 6px;
    font-size: 13px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-0); color: var(--text-0);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  input, select, button { font-family: inherit; font-size: inherit; color: inherit; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 6px; white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; font-family: "SF Mono", Menlo, Consolas, monospace; }
  .buy-color { color: var(--buy); }
  .sell-color { color: var(--sell); }
  .muted { color: var(--text-1); }
  .hidden { display: none !important; }
  button {
    cursor: pointer; border: 1px solid var(--border); background: var(--bg-3);
    color: var(--text-0); border-radius: var(--radius); padding: 5px 10px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.buy-btn { background: var(--buy); border-color: var(--buy); color: #05221a; font-weight: 700; }
  button.sell-btn { background: var(--sell); border-color: var(--sell); color: #2c0810; font-weight: 700; }
  button.ghost { background: transparent; }
  button.icon-btn { padding: 4px 6px; background: transparent; border-color: transparent; }
  button.icon-btn:hover { background: var(--bg-3); }
  input[type="text"], input[type="number"], input[type="date"], select {
    background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 5px 7px; color: var(--text-0); width: 100%;
  }
  input.invalid { border-color: var(--sell); }
  ::placeholder { color: var(--text-2); }

  /* ---- shell layout ---- */
  #app { display: flex; flex-direction: column; height: 100vh; }

  #margin-banner {
    display: none; padding: 6px 16px; text-align: center; font-weight: 700;
    background: var(--sell); color: white; letter-spacing: .02em;
  }
  #margin-banner.show { display: block; }
  #margin-banner.stopout { background: #8c0f28; }

  #topbar {
    display: flex; align-items: center; gap: 16px; padding: 8px 16px;
    background: var(--bg-1); border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  #brand img { height: 24px; display: block; }
  #brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  #account-switcher { display: flex; align-items: center; gap: 8px; }
  #account-switcher select { width: auto; }

  #balances { display: flex; gap: 18px; margin-left: auto; align-items: center; }
  .balance-item { display: flex; flex-direction: column; line-height: 1.25; }
  .balance-item .label { font-size: 10px; text-transform: uppercase; color: var(--text-2); letter-spacing: .04em; }
  .balance-item .value { font-weight: 600; }
  #privacy-toggle { font-size: 15px; }

  #topbar-actions { display: flex; gap: 8px; }

  #main {
    flex: 1; display: grid; min-height: 0;
    grid-template-columns: 340px 1fr 300px;
    grid-template-rows: 1fr 260px;
    grid-template-areas:
      "watchlist chart ticket"
      "bottom bottom ticket";
  }

  /* ---- watchlist ---- */
  #watchlist-panel { grid-area: watchlist; background: var(--bg-1); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid var(--border); font-weight: 600; }
  #watchlist-body { overflow-y: auto; flex: 1; position: relative; }
  #watchlist-table th { position: sticky; top: 0; background: var(--bg-1); font-size: 10px; text-transform: uppercase; color: var(--text-2); border-bottom: 1px solid var(--border); z-index: 1; }
  #watchlist-table tr.row { cursor: grab; border-bottom: 1px solid var(--bg-2); }
  #watchlist-table tr.row:hover { background: var(--bg-2); }
  #watchlist-table tr.row.selected { background: var(--accent-dim); }
  #watchlist-table tr.row.dragging { opacity: .4; }
  #watchlist-table td.sym { font-weight: 600; }
  #watchlist-table td.flash-up { animation: flashUp .5s ease; }
  #watchlist-table td.flash-down { animation: flashDown .5s ease; }
  @keyframes flashUp { 0% { background: var(--buy-dim); } 100% { background: transparent; } }
  @keyframes flashDown { 0% { background: var(--sell-dim); } 100% { background: transparent; } }

  #columns-menu {
    position: absolute; right: 8px; top: 34px; background: var(--bg-3); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  #columns-menu label { display: flex; gap: 6px; align-items: center; padding: 3px 4px; white-space: nowrap; }

  /* ---- chart ---- */
  #chart-panel { grid-area: chart; display: flex; flex-direction: column; min-height: 0; background: var(--bg-0); border-right: 1px solid var(--border); }
  #chart-head { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  #chart-symbol { font-weight: 700; font-size: 15px; }
  #chart-price { font-weight: 700; }
  .tf-group { display: flex; gap: 4px; margin-left: auto; }
  .tf-btn { padding: 3px 9px; font-size: 11px; }
  .tf-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #chart-canvas-wrap { flex: 1; position: relative; min-height: 0; }
  #chart-canvas { width: 100%; height: 100%; display: block; }
  #symbol-info { display: flex; flex-wrap: wrap; gap: 16px; padding: 8px 12px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-1); }
  #symbol-info b { color: var(--text-0); }

  /* ---- order ticket / alerts ---- */
  #right-col { grid-area: ticket; background: var(--bg-1); border-left: 1px solid var(--border); overflow-y: auto; }
  #ticket { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  #ticket h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; color: var(--text-2); }
  .price-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .price-box { flex: 1; text-align: center; padding: 8px; border-radius: var(--radius); border: 1px solid var(--border); cursor: pointer; }
  .price-box .lbl { font-size: 10px; color: var(--text-2); text-transform: uppercase; }
  .price-box .val { font-weight: 700; font-size: 15px; font-family: "SF Mono", Menlo, Consolas, monospace; }
  .price-box.sell-box { background: var(--sell-dim); }
  .price-box.buy-box { background: var(--buy-dim); }
  .field-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-end; }
  .field { flex: 1; }
  .field label { display: block; font-size: 10px; color: var(--text-2); margin-bottom: 3px; text-transform: uppercase; }
  .field small.err { display: block; color: var(--sell); font-size: 10px; margin-top: 2px; min-height: 12px; }
  .order-type-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .order-type-tabs button { flex: 1; padding: 4px; font-size: 11px; }
  .order-type-tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .submit-row { display: flex; gap: 8px; }
  .submit-row button { flex: 1; padding: 9px; font-size: 13px; }

  #alerts-panel { padding: 10px 12px; }
  #alerts-panel h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; color: var(--text-2); }
  .alert-row { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--bg-2); font-size: 12px; }
  .alert-row.triggered { color: var(--warn); }
  .alert-row .grow { flex: 1; }
  #alert-form { display: flex; gap: 6px; margin-top: 8px; }
  #alert-form select, #alert-form input { padding: 4px 6px; }

  /* ---- bottom tabs ---- */
  #bottom-panel { grid-area: bottom; background: var(--bg-1); border-top: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  #bottom-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #bottom-tabs button { border: none; border-radius: 0; background: transparent; padding: 8px 16px; border-bottom: 2px solid transparent; }
  #bottom-tabs button.active { border-bottom-color: var(--accent); color: var(--text-0); font-weight: 600; }
  #bottom-tabs button { color: var(--text-1); }
  .bottom-toolbar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--bg-2); }
  #bottom-body { flex: 1; overflow-y: auto; }
  #bottom-body table th { position: sticky; top: 0; background: var(--bg-1); font-size: 10px; text-transform: uppercase; color: var(--text-2); border-bottom: 1px solid var(--border); }
  #bottom-body table tr:hover { background: var(--bg-2); }
  .tab-pane { display: none; height: 100%; flex-direction: column; }
  .tab-pane.active { display: flex; }
  .editable-cell { cursor: text; border-bottom: 1px dashed var(--text-2); }
  .editable-cell input { width: 70px; padding: 2px 4px; }
  .empty-state { padding: 30px; text-align: center; color: var(--text-2); }
  .stat-cards { display: flex; gap: 12px; padding: 12px; flex-wrap: wrap; }
  .stat-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; min-width: 130px; }
  .stat-card .label { font-size: 10px; text-transform: uppercase; color: var(--text-2); }
  .stat-card .value { font-size: 18px; font-weight: 700; margin-top: 4px; }

  /* ---- modal ---- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
    width: 380px; max-width: 92vw; padding: 18px;
  }
  .modal h2 { margin: 0 0 12px; font-size: 15px; }
  .modal-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .modal-tabs button { flex: 1; }
  .modal-tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal-close { position: absolute; top: 10px; right: 10px; }
  .modal-wrap { position: relative; }
  .toast-stack { position: fixed; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 200; }
  .toast { background: var(--bg-3); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius); padding: 10px 14px; min-width: 220px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .toast.warn { border-left-color: var(--warn); }
  .toast.buy { border-left-color: var(--buy); }
  .toast.sell { border-left-color: var(--sell); }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">

  <div id="margin-banner"></div>

  <!-- ===================== TOP BAR ===================== -->
  <div id="topbar">
    <div id="brand">
      <img id="brand-logo" src="https://placehold.co/28x28?text=V" alt="broker logo" />
      <span id="brand-name">vyX</span>
      <span class="dot"></span>
    </div>

    <div id="account-switcher">
      <select id="account-type-select">
        <option value="demo">Demo</option>
        <option value="live">Live</option>
      </select>
      <span class="muted num" id="account-number"></span>
    </div>

    <div id="balances">
      <div class="balance-item"><span class="label">Balance</span><span class="value num" data-priv="balance"></span></div>
      <div class="balance-item"><span class="label">Equity</span><span class="value num" data-priv="equity"></span></div>
      <div class="balance-item"><span class="label">Margin</span><span class="value num" data-priv="margin"></span></div>
      <div class="balance-item"><span class="label">Free Margin</span><span class="value num" data-priv="freeMargin"></span></div>
      <div class="balance-item"><span class="label">Margin Level</span><span class="value num" data-priv="marginLevel"></span></div>
      <button class="icon-btn" id="privacy-toggle" title="Hide balances">👁</button>
    </div>

    <div id="topbar-actions">
      <button id="open-deposit">Deposit</button>
      <button id="open-withdraw">Withdraw</button>
    </div>
  </div>

  <!-- ===================== MAIN GRID ===================== -->
  <div id="main">

    <!-- Watchlist -->
    <div id="watchlist-panel">
      <div class="panel-head">
        <span>Watchlist</span>
        <button class="icon-btn" id="columns-toggle" title="Customize columns">⚙</button>
      </div>
      <div id="watchlist-body">
        <table id="watchlist-table">
          <thead><tr id="watchlist-head-row"></tr></thead>
          <tbody id="watchlist-rows"></tbody>
        </table>
        <div id="columns-menu" class="hidden"></div>
      </div>
    </div>

    <!-- Chart -->
    <div id="chart-panel">
      <div id="chart-head">
        <span id="chart-symbol"></span>
        <span id="chart-price" class="num"></span>
        <div class="tf-group" id="tf-group"></div>
      </div>
      <div id="chart-canvas-wrap">
        <canvas id="chart-canvas"></canvas>
      </div>
      <div id="symbol-info"></div>
    </div>

    <!-- Order ticket + alerts -->
    <div id="right-col">
      <div id="ticket">
        <h3>New Order</h3>
        <div class="price-row">
          <div class="price-box sell-box" id="ticket-sell-box">
            <div class="lbl">Sell</div>
            <div class="val num sell-color" id="ticket-bid"></div>
          </div>
          <div class="price-box buy-box" id="ticket-buy-box">
            <div class="lbl">Buy</div>
            <div class="val num buy-color" id="ticket-ask"></div>
          </div>
        </div>

        <div class="order-type-tabs" id="order-type-tabs">
          <button data-type="MARKET" class="active">Market</button>
          <button data-type="LIMIT">Limit</button>
          <button data-type="STOP">Stop</button>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Volume (lots)</label>
            <input type="number" id="ticket-volume" value="0.10" step="0.01" min="0.01" />
            <small class="err" id="err-volume"></small>
          </div>
          <div class="field hidden" id="price-field">
            <label>Price</label>
            <input type="number" id="ticket-price" step="0.00001" />
            <small class="err" id="err-price"></small>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Stop Loss</label>
            <input type="number" id="ticket-sl" step="0.00001" placeholder="off" />
            <small class="err" id="err-sl"></small>
          </div>
          <div class="field">
            <label>Take Profit</label>
            <input type="number" id="ticket-tp" step="0.00001" placeholder="off" />
            <small class="err" id="err-tp"></small>
          </div>
        </div>

        <div class="submit-row">
          <button class="sell-btn" id="submit-sell">Sell</button>
          <button class="buy-btn" id="submit-buy">Buy</button>
        </div>
      </div>

      <div id="alerts-panel">
        <h3>Price Alerts</h3>
        <div id="alerts-list"></div>
        <div id="alert-form">
          <select id="alert-condition">
            <option value="above">Above</option>
            <option value="below">Below</option>
          </select>
          <input type="number" id="alert-price" step="0.00001" placeholder="price" />
          <button id="alert-add">Add</button>
        </div>
      </div>
    </div>

    <!-- Bottom tabs: positions / orders / history / analytics -->
    <div id="bottom-panel">
      <div id="bottom-tabs">
        <button data-tab="positions" class="active">Positions</button>
        <button data-tab="pending">Pending Orders</button>
        <button data-tab="history">Trade History</button>
        <button data-tab="analytics">Analytics</button>
      </div>

      <div id="bottom-body">
        <!-- Positions -->
        <div class="tab-pane active" id="pane-positions">
          <div class="bottom-toolbar">
            <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="net-toggle" /> Net positions</label>
            <span class="muted" id="positions-summary" style="margin-left:auto;"></span>
          </div>
          <div id="positions-table-wrap"></div>
        </div>
        <!-- Pending -->
        <div class="tab-pane" id="pane-pending">
          <div id="pending-table-wrap"></div>
        </div>
        <!-- History -->
        <div class="tab-pane" id="pane-history">
          <div class="bottom-toolbar">
            <label>From <input type="date" id="hist-from" style="width:140px;display:inline-block;" /></label>
            <label>To <input type="date" id="hist-to" style="width:140px;display:inline-block;" /></label>
            <label>Symbol
              <select id="hist-symbol" style="width:120px;display:inline-block;"><option value="">All</option></select>
            </label>
          </div>
          <div id="history-table-wrap"></div>
        </div>
        <!-- Analytics -->
        <div class="tab-pane" id="pane-analytics">
          <div class="stat-cards" id="analytics-cards"></div>
          <div style="padding:0 12px 12px;">
            <canvas id="analytics-canvas" height="140"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===================== DEPOSIT / WITHDRAW MODAL ===================== -->
<div class="modal-overlay" id="txn-modal">
  <div class="modal modal-wrap">
    <button class="icon-btn modal-close" id="txn-close">✕</button>
    <h2 id="txn-title">Deposit</h2>
    <div class="modal-tabs">
      <button data-txn="deposit" class="active">Deposit</button>
      <button data-txn="withdraw">Withdraw</button>
    </div>
    <div class="field" style="margin-bottom:8px;">
      <label>Amount (USD)</label>
      <input type="number" id="txn-amount" min="1" step="1" placeholder="100" />
    </div>
    <div class="field" style="margin-bottom:14px;">
      <label>Method</label>
      <select id="txn-method">
        <option>Bank Transfer</option>
        <option>Card</option>
        <option>Crypto</option>
      </select>
    </div>
    <button class="primary" id="txn-submit" style="width:100%;padding:10px;">Submit</button>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script>
(function () {
  "use strict";

  // ==========================================================================
  // 1. STATIC REFERENCE DATA
  // ==========================================================================

  const SYMBOL_DEFS = [
    { name: "EURUSD", category: "FOREX",  digits: 5, base: 1.0850, vol: 0.00006, contractSize: 100000 },
    { name: "GBPUSD", category: "FOREX",  digits: 5, base: 1.2680, vol: 0.00007, contractSize: 100000 },
    { name: "USDJPY", category: "FOREX",  digits: 3, base: 156.20, vol: 0.008,   contractSize: 100000 },
    { name: "AUDUSD", category: "FOREX",  digits: 5, base: 0.6520, vol: 0.00005, contractSize: 100000 },
    { name: "XAUUSD", category: "METALS", digits: 2, base: 2352.40, vol: 0.35,   contractSize: 100 },
    { name: "XAGUSD", category: "METALS", digits: 3, base: 27.80,  vol: 0.02,    contractSize: 5000 },
    { name: "BTCUSD", category: "CRYPTO", digits: 1, base: 62150.0, vol: 25,     contractSize: 1 },
    { name: "ETHUSD", category: "CRYPTO", digits: 2, base: 3420.00, vol: 3.2,    contractSize: 1 },
    { name: "US30",   category: "INDICES", digits: 1, base: 38950.0, vol: 4.5,   contractSize: 1 },
    { name: "NAS100",  category: "INDICES", digits: 1, base: 18240.0, vol: 5.5,  contractSize: 1 },
  ];

  const ALL_COLUMNS = [
    { key: "bid", label: "Bid" },
    { key: "ask", label: "Ask" },
    { key: "spread", label: "Spread" },
    { key: "change", label: "Chg %" },
    { key: "high", label: "High" },
    { key: "low", label: "Low" },
  ];
  let visibleColumns = new Set(["bid", "ask", "spread", "change"]);
  let watchlistOrder = SYMBOL_DEFS.map((s) => s.name);

  // ==========================================================================
  // 2. LIVE MARKET STATE (simulated, client-side — same approach as before
  //    the real execution engine exists, per the Phase 2 plan)
  // ==========================================================================

  const market = {}; // name -> { bid, ask, prevBid, dayOpen, high, low, candles: {tf: [...]}, spreadPips }
  SYMBOL_DEFS.forEach((def) => {
    const spread = def.digits >= 3 ? def.vol * 0.6 : def.base * 0.00006;
    market[def.name] = {
      def,
      bid: def.base,
      ask: def.base + spread,
      prevBid: def.base,
      dayOpen: def.base,
      high: def.base,
      low: def.base,
      candles: { M1: [], M5: [], H1: [] },
      lastCandleStart: { M1: 0, M5: 0, H1: 0 },
    };
  });

  function tfMillis(tf) {
    return tf === "M1" ? 2000 : tf === "M5" ? 6000 : 15000; // compressed for demo purposes
  }

  function tick() {
    Object.values(market).forEach((m) => {
      m.prevBid = m.bid;
      const drift = (Math.random() - 0.5) * m.def.vol;
      m.bid = Math.max(m.def.vol, m.bid + drift);
      const spread = m.def.digits >= 3 ? m.def.vol * 0.6 : m.def.base * 0.00006;
      m.ask = m.bid + spread;
      m.high = Math.max(m.high, m.bid);
      m.low = Math.min(m.low, m.bid);

      ["M1", "M5", "H1"].forEach((tf) => {
        const period = tfMillis(tf);
        const bucket = Math.floor(Date.now() / period);
        const candles = m.candles[tf];
        if (m.lastCandleStart[tf] !== bucket) {
          m.lastCandleStart[tf] = bucket;
          candles.push({ o: m.bid, h: m.bid, l: m.bid, c: m.bid, t: bucket });
          if (candles.length > 120) candles.shift();
        } else if (candles.length) {
          const c = candles[candles.length - 1];
          c.h = Math.max(c.h, m.bid);
          c.l = Math.min(c.l, m.bid);
          c.c = m.bid;
        }
      });
    });
    checkAlerts();
    checkPositionCloses();
    renderWatchlist();
    renderChart();
    renderTicketPrices();
    renderPositions();
    renderMarginBanner();
    renderBalances();
  }

  // seed some initial candles so the chart isn't empty on load
  (function seedCandles() {
    for (let i = 0; i < 80; i++) {
      Object.values(market).forEach((m) => {
        const drift = (Math.random() - 0.5) * m.def.vol;
        m.bid = Math.max(m.def.vol, m.bid + drift);
        const spread = m.def.digits >= 3 ? m.def.vol * 0.6 : m.def.base * 0.00006;
        m.ask = m.bid + spread;
        m.high = Math.max(m.high, m.bid);
        m.low = Math.min(m.low, m.bid);
        ["M1", "M5", "H1"].forEach((tf) => {
          const candles = m.candles[tf];
          const last = candles[candles.length - 1];
          if (!last || i % (tf === "M1" ? 1 : tf === "M5" ? 3 : 6) === 0) {
            candles.push({ o: m.bid, h: m.bid, l: m.bid, c: m.bid, t: i });
          } else {
            last.h = Math.max(last.h, m.bid);
            last.l = Math.min(last.l, m.bid);
            last.c = m.bid;
          }
        });
      });
    }
  })();

  // ==========================================================================
  // 5. HELPERS
  // ==========================================================================

  function fmt(value, digits) {
    return Number(value).toFixed(digits);
  }
  function money(value) {
    const sign = value < 0 ? "-" : "";
    return sign + "$" + Math.abs(value).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }
  function priv(str) {
    return privacyMode ? "••••••" : str;
  }
  function toast(message, kind) {
    const stack = document.getElementById("toast-stack");
    const el = document.createElement("div");
    el.className = "toast" + (kind ? " " + kind : "");
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  }
  function contractValue(symbolName, price, volume) {
    const m = market[symbolName];
    return m.def.contractSize * volume * price;
  }
  function usedMargin(acct) {
    return acct.positions.reduce((sum, p) => {
      const m = market[p.symbol];
      return sum + contractValue(p.symbol, m.bid, p.volume) / acct.leverage;
    }, 0);
  }
  function floatingPnl(acct) {
    return acct.positions.reduce((sum, p) => sum + positionPnl(p), 0);
  }
  function positionPnl(p) {
    const m = market[p.symbol];
    const closePrice = p.side === "BUY" ? m.bid : m.ask;
    const diff = p.side === "BUY" ? closePrice - p.openPrice : p.openPrice - closePrice;
    return diff * m.def.contractSize * p.volume;
  }
  function equity(acct) { return acct.balance + acct.credit + floatingPnl(acct); }
  function marginLevelPct(acct) {
    const used = usedMargin(acct);
    if (used <= 0) return Infinity;
    return (equity(acct) / used) * 100;
  }

  function renderWatchlistHead() {
    const row = document.getElementById("watchlist-head-row");

  function renderWatchlist() {
    const tbody = document.getElementById("watchlist-rows");
    const cols = ALL_COLUMNS.filter((c) => visibleColumns.has(c.key));
    const existingRows = {};
    tbody.querySelectorAll("tr.row").forEach((r) => (existingRows[r.dataset.symbol] = r));

    watchlistOrder.forEach((name) => {
      const m = market[name];
      const spreadVal = m.ask - m.bid;
      const changePct = ((m.bid - m.dayOpen) / m.dayOpen) * 100;
      const values = {
        bid: fmt(m.bid, m.def.digits),
        ask: fmt(m.ask, m.def.digits),
        spread: fmt(spreadVal, m.def.digits),
        change: (changePct >= 0 ? "+" : "") + changePct.toFixed(2) + "%",
        high: fmt(m.high, m.def.digits),
        low: fmt(m.low, m.def.digits),
      };

      let tr = existingRows[name];
      if (!tr) {
        tr = document.createElement("tr");
        tr.className = "row";
        tr.dataset.symbol = name;
        tr.draggable = true;
        tr.addEventListener("click", () => selectSymbol(name));
        attachDragHandlers(tr);
        tbody.appendChild(tr);
      }
      tr.classList.toggle("selected", name === selectedSymbol);

      const direction = m.bid > m.prevBid ? "flash-up" : m.bid < m.prevBid ? "flash-down" : null;
      const cells = [`<td class="sym">${name}</td>`].concat(
        cols.map((c) => `<td class="num${direction && (c.key === "bid" || c.key === "ask") ? " " + direction : ""}">${values[c.key]}</td>`)
      );
      tr.innerHTML = cells.join("");
    });

    // remove rows for symbols no longer in order (not expected, but keep robust)

  // 7. CHART (canvas candlesticks — no external charting library)
  // ==========================================================================

  const canvas = document.getElementById("chart-canvas");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    const wrap = document.getElementById("chart-canvas-wrap");
    const dpr = window.devicePixelRatio || 1;
    canvas.width = wrap.clientWidth * dpr;
    canvas.height = wrap.clientHeight * dpr;
    canvas.style.width = wrap.clientWidth + "px";
    canvas.style.height = wrap.clientHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function renderChart() {
    const wrap = document.getElementById("chart-canvas-wrap");
    if (canvas.width !== wrap.clientWidth * (window.devicePixelRatio || 1)) resizeCanvas();
    const w = wrap.clientWidth, h = wrap.clientHeight;
    ctx.clearRect(0, 0, w, h);

    const m = market[selectedSymbol];
    const candles = m.candles[selectedTf];
    if (!candles.length) return;

    const padLeft = 8, padRight = 56, padTop = 10, padBottom = 20;
    const plotW = w - padLeft - padRight, plotH = h - padTop - padBottom;

    const visible = candles.slice(-Math.floor(plotW / 8));
    let min = Infinity, max = -Infinity;
    visible.forEach((c) => { min = Math.min(min, c.l); max = Math.max(max, c.h); });
    if (min === max) { min -= 1; max += 1; }
    const pad = (max - min) * 0.08;
    min -= pad; max += pad;

    const y = (price) => padTop + (1 - (price - min) / (max - min)) * plotH;
    const candleW = plotW / visible.length;

    // grid + price labels
    ctx.strokeStyle = "#1b2233";
    ctx.fillStyle = "#5c6788";
    ctx.font = "10px monospace";
    ctx.lineWidth = 1;
    const steps = 5;
    for (let i = 0; i <= steps; i++) {
      const price = min + ((max - min) * i) / steps;
      const yy = y(price);
      ctx.beginPath();
      ctx.moveTo(padLeft, yy);
      ctx.lineTo(w - padRight, yy);
      ctx.stroke();
      ctx.fillText(fmt(price, m.def.digits), w - padRight + 6, yy + 3);
    }

    visible.forEach((c, i) => {
      const cx = padLeft + i * candleW + candleW / 2;
      const up = c.c >= c.o;
      ctx.strokeStyle = ctx.fillStyle = up ? "#16c78d" : "#f0526a";
      ctx.beginPath();
      ctx.moveTo(cx, y(c.h));
      ctx.lineTo(cx, y(c.l));
      ctx.stroke();
      const bodyTop = y(Math.max(c.o, c.c));
      const bodyBottom = y(Math.min(c.o, c.c));
      const bw = Math.max(candleW * 0.6, 2);
      ctx.fillRect(cx - bw / 2, bodyTop, bw, Math.max(bodyBottom - bodyTop, 1));
    });

    // current bid line
    const lastY = y(m.bid);
    ctx.strokeStyle = "#2f7dfb";
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(padLeft, lastY);
    ctx.lineTo(w - padRight, lastY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#2f7dfb";
    ctx.fillRect(w - padRight, lastY - 8, padRight - 4, 16);
    ctx.fillStyle = "#fff";
    ctx.fillText(fmt(m.bid, m.def.digits), w - padRight + 4, lastY + 3);

    document.getElementById("chart-symbol").textContent = selectedSymbol;
    document.getElementById("chart-price").textContent = fmt(m.bid, m.def.digits);
    document.getElementById("chart-price").className = "num " + (m.bid >= m.prevBid ? "buy-color" : "sell-color");
  }

  function clearFieldErrors() {

  // side-aware SL/TP validation: for BUY, SL must sit below the reference
  // price and TP above it; for SELL, the inequalities flip.
  function validateOrder(side) {
    clearFieldErrors();
    let ok = true;
    const m = market[selectedSymbol];
    const volume = parseFloat(document.getElementById("ticket-volume").value);
    if (!(volume > 0)) { setFieldError("volume", "Volume must be > 0"); ok = false; }
    else if (volume < 0.01 || volume > 100) { setFieldError("volume", "Range 0.01–100"); ok = false; }

    let refPrice = side === "BUY" ? m.ask : m.bid;
    if (selectedOrderType !== "MARKET") {
      const p = parseFloat(document.getElementById("ticket-price").value);
      if (!(p > 0)) { setFieldError("price", "Enter a price"); ok = false; }
      else refPrice = p;
    }

    const slRaw = document.getElementById("ticket-sl").value;
    const tpRaw = document.getElementById("ticket-tp").value;
    if (slRaw !== "") {
      const sl = parseFloat(slRaw);
      if (side === "BUY" && sl >= refPrice) { setFieldError("sl", "SL must be below price"); ok = false; }
      if (side === "SELL" && sl <= refPrice) { setFieldError("sl", "SL must be above price"); ok = false; }
    }
    if (tpRaw !== "") {
      const tp = parseFloat(tpRaw);
      if (side === "BUY" && tp <= refPrice) { setFieldError("tp", "TP must be above price"); ok = false; }
      if (side === "SELL" && tp >= refPrice) { setFieldError("tp", "TP must be below price"); ok = false; }
    }
    return ok ? { volume, refPrice, sl: slRaw === "" ? null : parseFloat(slRaw), tp: tpRaw === "" ? null : parseFloat(tpRaw) } : null;
  }

  function submitOrder(side) {
    const result = validateOrder(side);
    if (!result) return;
    const acct = account();
    const m = market[selectedSymbol];

    if (selectedOrderType === "MARKET") {
      // idempotency: a duplicated click within the debounce window is a no-op
      const openPrice = side === "BUY" ? m.ask : m.bid;
      acct.positions.push({
        id: nextId(), symbol: selectedSymbol, side, volume: result.volume,
        openPrice, sl: result.sl, tp: result.tp, openedAt: Date.now(),
      });
      toast(`${side} ${result.volume} ${selectedSymbol} @ ${fmt(openPrice, m.def.digits)}`, side.toLowerCase());
    } else {
      acct.pending.push({
        id: nextId(), symbol: selectedSymbol, side, type: selectedOrderType,
        volume: result.volume, price: result.refPrice, sl: result.sl, tp: result.tp, createdAt: Date.now(),
      });
      toast(`${selectedOrderType} ${side} order placed for ${selectedSymbol}`, side.toLowerCase());
    }
    clearFieldErrors();
    renderPositions();
    renderPending();
    renderBalances();
  }

  document.getElementById("submit-buy").addEventListener("click", () => submitOrder("BUY"));
  document.getElementById("submit-sell").addEventListener("click", () => submitOrder("SELL"));
  document.getElementById("ticket-buy-box").addEventListener("click", () => document.getElementById("submit-buy").click());
  document.getElementById("ticket-sell-box").addEventListener("click", () => document.getElementById("submit-sell").click());

  // check pending limit/stop orders against live price each tick
  function checkPendingFills() {
    const acct = account();
    if (!acct.pending.length) return;
    const stillPending = [];
    acct.pending.forEach((o) => {
      const m = market[o.symbol];
      const price = o.side === "BUY" ? m.ask : m.bid;
      let shouldFill = false;
      if (o.type === "LIMIT") shouldFill = o.side === "BUY" ? price <= o.price : price >= o.price;
      if (o.type === "STOP") shouldFill = o.side === "BUY" ? price >= o.price : price <= o.price;
      if (shouldFill) {
        acct.positions.push({ id: nextId(), symbol: o.symbol, side: o.side, volume: o.volume, openPrice: price, sl: o.sl, tp: o.tp, openedAt: Date.now() });
        toast(`Pending order filled: ${o.side} ${o.volume} ${o.symbol} @ ${fmt(price, m.def.digits)}`, o.side.toLowerCase());
      } else {
        stillPending.push(o);
      }
    });
    acct.pending = stillPending;
  }

  const alerts = []; // {id, symbol, condition, price, triggered}

  function renderAlerts() {
    const list = document.getElementById("alerts-list");
    if (!alerts.length) { list.innerHTML = '<div class="muted">No alerts set.</div>'; return; }
    list.innerHTML = alerts.map((a) => `

    document.getElementById("alert-price").value = "";

  });

  function checkAlerts() {
    let changed = false;
    alerts.forEach((a) => {
      if (a.triggered) return;
      const m = market[a.symbol];
      const hit = a.condition === "above" ? m.bid >= a.price : m.bid <= a.price;
      if (hit) {
        a.triggered = true;
        changed = true;
        toast(`Alert: ${a.symbol} is ${a.condition} ${fmt(a.price, m.def.digits)}`, "warn");
      }
    });
    if (changed) renderAlerts();

  function renderPositions() {
    const acct = account();

      return;
    }

    const rows = acct.positions.map((p) => {
      const m = market[p.symbol];
      const pnl = positionPnl(p);
      return `
      <tr data-pos="${p.id}">
        <td class="sym">${p.symbol}</td>
        <td class="${p.side === "BUY" ? "buy-color" : "sell-color"}">${p.side}</td>

        <td><button class="ghost close-btn" data-close="${p.id}">Close</button></td>
      </tr>`;
    }).join("");

    wrap.innerHTML = `<table>
      <thead><tr><th>Symbol</th><th>Side</th><th>Vol</th><th>Open</th><th>Current</th><th>SL</th><th>TP</th><th>P/L</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>`;

    wrap.querySelectorAll(".close-btn").forEach((btn) => btn.addEventListener("click", () => closePosition(Number(btn.dataset.close), "manual")));
    wrap.querySelectorAll(".editable-cell").forEach((cell) => {
      cell.addEventListener("click", () => startEditCell(cell));

  function startEditCell(cell) {
    if (cell.querySelector("input")) return;
    const tr = cell.closest("tr");
    const posId = Number(tr.dataset.pos);
    const acct = account();
    const p = acct.positions.find((x) => x.id === posId);
    const field = cell.dataset.field;
    const current = p[field];
    const input = document.createElement("input");
    input.type = "number";
    input.step = "0.00001";
    input.value = current != null ? current : "";
    cell.textContent = "";
    cell.appendChild(input);
    input.focus();

    function commit() {
      const val = input.value === "" ? null : parseFloat(input.value);
      if (val != null) {
        const m = market[p.symbol];
        const ref = p.side === "BUY" ? m.bid : m.ask;
        if (field === "sl") {
          if ((p.side === "BUY" && val >= ref) || (p.side === "SELL" && val <= ref)) {
            toast(`Invalid SL for ${p.side} position`, "warn");
            renderPositions();
            return;
          }
        } else {
          if ((p.side === "BUY" && val <= ref) || (p.side === "SELL" && val >= ref)) {
            toast(`Invalid TP for ${p.side} position`, "warn");
            renderPositions();
            return;
          }
        }
      }
      p[field] = val;
      renderPositions();
    }
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") input.blur();
      if (e.key === "Escape") { input.value = current != null ? current : ""; input.blur(); }
    });
  }

  function closePosition(posId, reason) {
    const acct = account();
    const idx = acct.positions.findIndex((p) => p.id === posId);
    if (idx === -1) return;
    const p = acct.positions[idx];
    const m = market[p.symbol];
    const closePrice = p.side === "BUY" ? m.bid : m.ask;
    const pnl = positionPnl(p);
    acct.balance += pnl;
    acct.positions.splice(idx, 1);
    acct.history.push({
      id: p.id, symbol: p.symbol, side: p.side, volume: p.volume,
      openPrice: p.openPrice, closePrice, pnl, openedAt: p.openedAt, closedAt: Date.now(), reason,
    });
    renderPositions();
    renderBalances();
    renderHistory();
    renderAnalytics();
    if (reason !== "manual") {
      toast(`${reason === "sl" ? "Stop Loss" : "Take Profit"} hit on ${p.symbol}: ${money(pnl)}`, pnl >= 0 ? "buy" : "sell");
    }
  }

  function checkPositionCloses() {
    const acct = account();
    [...acct.positions].forEach((p) => {
      const m = market[p.symbol];
      const price = p.side === "BUY" ? m.bid : m.ask;
      if (p.sl != null) {
        const hit = p.side === "BUY" ? price <= p.sl : price >= p.sl;
        if (hit) return closePosition(p.id, "sl");
      }
      if (p.tp != null) {
        const hit = p.side === "BUY" ? price >= p.tp : price <= p.tp;
        if (hit) return closePosition(p.id, "tp");
      }
    });
    checkPendingFills();
  }

  document.getElementById("net-toggle").addEventListener("change", (e) => {
    netPositionsView = e.target.checked;
    renderPositions();
  });

  // ==========================================================================
  // 11. PENDING ORDERS TAB
  // ==========================================================================

  function renderPending() {
    const acct = account();
    const wrap = document.getElementById("pending-table-wrap");
    if (!acct.pending.length) { wrap.innerHTML = '<div class="empty-state">No pending orders.</div>'; return; }
    const rows = acct.pending.map((o) => {
      const m = market[o.symbol];
      return `<tr>
        <td class="sym">${o.symbol}</td>
        <td>${o.type}</td>
        <td class="${o.side === "BUY" ? "buy-color" : "sell-color"}">${o.side}</td>
        <td class="num">${o.volume.toFixed(2)}</td>
        <td class="num">${fmt(o.price, m.def.digits)}</td>
        <td class="num">${o.sl != null ? fmt(o.sl, m.def.digits) : "—"}</td>
        <td class="num">${o.tp != null ? fmt(o.tp, m.def.digits) : "—"}</td>
        <td><button class="ghost" data-cancel="${o.id}">Cancel</button></td>
      </tr>`;
    }).join("");
    wrap.innerHTML = `<table><thead><tr><th>Symbol</th><th>Type</th><th>Side</th><th>Vol</th><th>Price</th><th>SL</th><th>TP</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
    wrap.querySelectorAll("[data-cancel]").forEach((btn) => btn.addEventListener("click", () => {
      acct.pending = acct.pending.filter((o) => o.id !== Number(btn.dataset.cancel));
      renderPending();
    }));
  }

  // ==========================================================================
  // 12. TRADE HISTORY (date-range + symbol filter)
  // ==========================================================================

  function populateHistorySymbolFilter() {
    const sel = document.getElementById("hist-symbol");
    const current = sel.value;
    sel.innerHTML = '<option value="">All</option>' + SYMBOL_DEFS.map((s) => `<option value="${s.name}">${s.name}</option>`).join("");
    sel.value = current;
  }

  function renderHistory() {
    const acct = account();
    const wrap = document.getElementById("history-table-wrap");
    const fromVal = document.getElementById("hist-from").value;
    const toVal = document.getElementById("hist-to").value;
    const symbolFilter = document.getElementById("hist-symbol").value;
    const from = fromVal ? new Date(fromVal + "T00:00:00").getTime() : -Infinity;
    const to = toVal ? new Date(toVal + "T23:59:59").getTime() : Infinity;

    const rows = acct.history
      .filter((t) => t.closedAt >= from && t.closedAt <= to && (!symbolFilter || t.symbol === symbolFilter))
      .sort((a, b) => b.closedAt - a.closedAt);

    if (!rows.length) { wrap.innerHTML = '<div class="empty-state">No trades in range.</div>'; return; }

    wrap.innerHTML = `<table><thead><tr><th>Symbol</th><th>Side</th><th>Vol</th><th>Open</th><th>Close</th><th>Closed</th><th>P/L</th></tr></thead><tbody>${
      rows.map((t) => {
        const m = market[t.symbol];
        return `<tr>
          <td class="sym">${t.symbol}</td>
          <td class="${t.side === "BUY" ? "buy-color" : "sell-color"}">${t.side}</td>
          <td class="num">${t.volume.toFixed(2)}</td>
          <td class="num">${fmt(t.openPrice, m.def.digits)}</td>
          <td class="num">${fmt(t.closePrice, m.def.digits)}</td>
          <td class="muted">${new Date(t.closedAt).toLocaleString()}</td>
          <td class="num ${t.pnl >= 0 ? "buy-color" : "sell-color"}">${money(t.pnl)}</td>
        </tr>`;
      }).join("")
    }</tbody></table>`;
  }

  ["hist-from", "hist-to", "hist-symbol"].forEach((id) =>
    document.getElementById(id).addEventListener("change", renderHistory)
  );

  // ==========================================================================
  // 13. ANALYTICS TAB
  // ==========================================================================

  function renderAnalytics() {
    const acct = account();
    const trades = acct.history;
    const cards = document.getElementById("analytics-cards");
    const wins = trades.filter((t) => t.pnl > 0);
    const losses = trades.filter((t) => t.pnl <= 0);
    const totalPnl = trades.reduce((s, t) => s + t.pnl, 0);
    const winRate = trades.length ? (wins.length / trades.length) * 100 : 0;
    const avgWin = wins.length ? wins.reduce((s, t) => s + t.pnl, 0) / wins.length : 0;
    const avgLoss = losses.length ? losses.reduce((s, t) => s + t.pnl, 0) / losses.length : 0;
    const grossLoss = Math.abs(losses.reduce((s, t) => s + t.pnl, 0));
    const grossWin = wins.reduce((s, t) => s + t.pnl, 0);
    const profitFactor = grossLoss > 0 ? grossWin / grossLoss : grossWin > 0 ? Infinity : 0;

    cards.innerHTML = [
      ["Total Trades", trades.length],
      ["Win Rate", winRate.toFixed(1) + "%"],
      ["Total P/L", money(totalPnl)],
      ["Avg Win", money(avgWin)],
      ["Avg Loss", money(avgLoss)],
      ["Profit Factor", isFinite(profitFactor) ? profitFactor.toFixed(2) : "∞"],
    ].map(([label, value]) => `<div class="stat-card"><div class="label">${label}</div><div class="value">${value}</div></div>`).join("");

    const acanvas = document.getElementById("analytics-canvas");
    const actx = acanvas.getContext("2d");
    const w = acanvas.clientWidth || 600;
    acanvas.width = w; acanvas.height = 140;
    actx.clearRect(0, 0, w, 140);
    if (!trades.length) return;
    const byDay = {};
    trades.forEach((t) => {
      const day = new Date(t.closedAt).toLocaleDateString();
      byDay[day] = (byDay[day] || 0) + t.pnl;
    });
    const days = Object.keys(byDay);
    const values = Object.values(byDay);
    const max = Math.max(...values.map(Math.abs), 1);
    const barW = w / days.length;
    days.forEach((day, i) => {
      const v = byDay[day];
      const barH = (Math.abs(v) / max) * 55;
      actx.fillStyle = v >= 0 ? "#16c78d" : "#f0526a";
      const x = i * barW + barW * 0.2;
      const y = v >= 0 ? 70 - barH : 70;
      actx.fillRect(x, y, barW * 0.6, barH);
    });
    actx.strokeStyle = "#262e42";
    actx.beginPath(); actx.moveTo(0, 70); actx.lineTo(w, 70); actx.stroke();
  }

  // ==========================================================================
  // 14. BOTTOM TABS
  // ==========================================================================

  document.getElementById("bottom-tabs").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-tab]");
    if (!btn) return;
    activeBottomTab = btn.dataset.tab;
    document.querySelectorAll("#bottom-tabs button").forEach((b) => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".tab-pane").forEach((p) => p.classList.remove("active"));
    document.getElementById("pane-" + activeBottomTab).classList.add("active");
    if (activeBottomTab === "analytics") renderAnalytics();
  });

  // ==========================================================================
  // 15. TOP BAR: account switcher, balances, privacy, margin banner
  // ==========================================================================

  function renderBalances() {
    const acct = account();
    document.getElementById("account-number").textContent = acct.accountNumber;
    const eq = equity(acct);
    const used = usedMargin(acct);
    const free = eq - used;
    const level = marginLevelPct(acct);

    const values = {
      balance: money(acct.balance),
      equity: money(eq),
      margin: money(used),
      freeMargin: money(free),
      marginLevel: isFinite(level) ? level.toFixed(0) + "%" : "—",
    };
    document.querySelectorAll("[data-priv]").forEach((el) => {
      el.textContent = priv(values[el.dataset.priv]);
    });
  }

  function renderMarginBanner() {
    const acct = account();
    const level = marginLevelPct(acct);
    const banner = document.getElementById("margin-banner");
    if (!acct.positions.length || !isFinite(level) || level >= 100) {
      banner.classList.remove("show", "stopout");
      return;
    }
    if (level < 50) {
      banner.textContent = `STOP OUT LEVEL — margin level ${level.toFixed(0)}% — positions may be force-closed`;
      banner.classList.add("show", "stopout");
    } else {
      banner.textContent = `MARGIN CALL — margin level ${level.toFixed(0)}% — add funds or reduce exposure`;
      banner.classList.add("show");
      banner.classList.remove("stopout");
    }
  }

  document.getElementById("privacy-toggle").addEventListener("click", () => {
    privacyMode = !privacyMode;
    document.getElementById("privacy-toggle").textContent = privacyMode ? "🙈" : "👁";
    renderBalances();
  });

  document.getElementById("account-type-select").addEventListener("change", (e) => {
    currentAccountType = e.target.value;
    renderAll();
    toast(`Switched to ${currentAccountType.toUpperCase()} account`);
  });

  // ==========================================================================
  // 16. DEPOSIT / WITHDRAW MODAL
  // ==========================================================================

  const txnModal = document.getElementById("txn-modal");
  function openTxnModal(type) {
    activeTxnTab = type;
    document.getElementById("txn-title").textContent = type === "deposit" ? "Deposit" : "Withdraw";
    document.querySelectorAll(".modal-tabs [data-txn]").forEach((b) => b.classList.toggle("active", b.dataset.txn === type));
    document.getElementById("txn-amount").value = "";
    txnModal.classList.add("show");
  }
  document.getElementById("open-deposit").addEventListener("click", () => openTxnModal("deposit"));
  document.getElementById("open-withdraw").addEventListener("click", () => openTxnModal("withdraw"));
  document.getElementById("txn-close").addEventListener("click", () => txnModal.classList.remove("show"));
  txnModal.addEventListener("click", (e) => { if (e.target === txnModal) txnModal.classList.remove("show"); });
  document.querySelectorAll(".modal-tabs [data-txn]").forEach((btn) =>
    btn.addEventListener("click", () => openTxnModal(btn.dataset.txn))
  );

  document.getElementById("txn-submit").addEventListener("click", () => {
    const amount = parseFloat(document.getElementById("txn-amount").value);
    const method = document.getElementById("txn-method").value;
    if (!(amount > 0)) { toast("Enter a valid amount", "warn"); return; }
    const acct = account();
    if (activeTxnTab === "withdraw" && amount > acct.balance) {
      toast("Insufficient balance for withdrawal", "warn");
      return;
    }
    // Simulated prototype only: a real backend would create a PENDING
    // Transaction ledger row here and require admin approval before the
    // balance moves. This client-side stub applies it immediately so the
    // UI/UX flow can be demoed without a backend.
    const delta = activeTxnTab === "deposit" ? amount : -amount;
    acct.balance += delta;
    acct.transactions.push({ id: nextId(), type: activeTxnTab, amount, method, createdAt: Date.now() });
    txnModal.classList.remove("show");
    renderBalances();
    toast(`${activeTxnTab === "deposit" ? "Deposit" : "Withdrawal"} of ${money(amount)} submitted`, "buy");
  });

  // ==========================================================================
  // 17. INIT
  // ==========================================================================

  function renderAll() {
    document.getElementById("account-type-select").value = currentAccountType;
    renderWatchlistHead();
    renderWatchlist();
    resizeCanvas();
    renderChart();
    renderSymbolInfo();
    renderTicketPrices();
    renderAlerts();
    renderPositions();
    renderPending();
    populateHistorySymbolFilter();
    renderHistory();
    renderAnalytics();
    renderBalances();
    renderMarginBanner();
  }

  renderAll();
  setInterval(tick, 1000);
})();
</script>
