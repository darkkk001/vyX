<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>VyXTrader</title>
<style>
  html, body { height: 100%; margin: 0; background: #07090C; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    color: #e8ecf4;
  }
  .mark {
    width: 56px; height: 56px; border-radius: 12px; background: #16C784;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #07090C; margin-bottom: 18px;
  }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid #262e42; border-top-color: #16C784;
    animation: spin 0.8s linear infinite; margin-top: 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 12px; color: #8891a6; margin: 0; }
</style>
</head>
<body>
  <div class="mark">V</div>
  <div class="spinner"></div>
  <p style="margin-top:12px;">Connecting…</p>
</body>
</html>
