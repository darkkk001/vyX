name: Next.js CI

# Phase 1 §4 (docs/ROADMAP.md's "CI: cargo test + vitest + tsc on every
# push") -- the Rust half already existed (engine-ci.yml); this closes
# the other half for the Next.js app. Scoped to paths that can actually
# affect it, same convention as engine-ci.yml's own path filter, so an
# engine-only or Tauri-shell-only push doesn't spend CI minutes here.
#
# Database and Redis (2026-11-02): the job runs against its own throwaway
# postgres:16 and redis:7 service containers, the pattern migrations-ci.yml
# already uses. Before, it pointed DATABASE_URL at nothing and relied on every
# DB-backed test skipping itself; the files written since late October do not,
# so the Test step had been red since 2026-10-29 (hidden behind a red Lint
# step), and the DB-backed half of the suite was never run in CI at all.
# The schema comes from deploy/replay-migrations.sh (every migration from
# zero), so CI also tests the migration chain the tests run on. The suite's
# own guards still apply: vitest.setup.db-guard.ts allows only a local host,
# and vitest.global.isolated-db.ts gives every test file its own clone of
# this database. ALLOW_TEST_DB_WRITES is set here only because this database
# is the ephemeral service container; it must never be set in Vercel.
on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "scripts/lib/**"
      - "deploy/replay-migrations.sh"
      - "vitest.*"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/nextjs-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "prisma/**"
      - "scripts/lib/**"
      - "deploy/replay-migrations.sh"
      - "vitest.*"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/nextjs-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vyx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vyx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # the service containers above: local, throwaway, empty at start
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/vyx_test"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/vyx_test"
      REDIS_URL: "redis://127.0.0.1:6379/9"
      ALLOW_TEST_DB_WRITES: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Generates the @prisma/client types/runtime tsc and vitest both
      # need -- it only reads prisma/schema.prisma.
      - name: Prisma generate
        run: npx prisma generate

      # The test database's schema: every migration from zero, as in migrations-ci.yml.
      - name: Test database schema
        run: bash deploy/replay-migrations.sh

      # The global platform-default Symbol rows every real database has (tests read "XAUUSD" / "EURUSD" by name).
      - name: Test database reference rows
        run: npx tsx scripts/seed-test-reference-data.ts

      # Hard gates -- a real type error, lint error, or test failure
      # fails this job.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
