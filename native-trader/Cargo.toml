[package]
name = "vyxtrader-native-terminal"
version = "0.1.0"
edition = "2021"
description = "True-native (zero-webview) Rust trader terminal -- egui/eframe, MT5-grade, no browser/webview anywhere. Sibling to native-backoffice/ (same theme/app-shell conventions), talks to the live /api/trade/* endpoints the real WebTrader uses."

[[bin]]
name = "vyxtrader-native-terminal"
path = "src/main.rs"

[dependencies]
eframe = "0.32"
egui_extras = { version = "0.32", features = ["image"] }
egui_plot = "0.32"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", features = ["json", "cookies"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
