[workspace]
resolver = "2"
members = [
    "protocol",
    "market-data",
    "order-management",
    "position",
    "risk",
    "margin",
    "execution",
    "ledger",
    "server",
    "loadtest",
    "parallel-run",
    "parity",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "rust_decimal", "chrono"] }
async-nats = "0.38"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"

# The license client, taken from the bridge BY A PIN and not copied (owner 2026-11-13): one license
# model, one implementation of it. qb-license-1.2.0 is the commit the three bridges have run in
# production since 2026-11-10 (qorebridge f77a73a) -- license enforcement phase 1.2 plus status report
# v2, which is the contract C:\vyx\handoff\license-enforcement-contract.md describes.
#
# Pinned by REV, not by tag and never by branch. A branch would let the bridge's next change reach this
# engine without anyone choosing it. A TAG is better but still movable -- and this repo gitignores
# engine/Cargo.lock (.gitignore:63), so there is no committed lock to fall back on and the manifest is
# the only thing holding the pin. A commit sha cannot be moved, so that is what holds it.
# f77a73a6 is what the tag qb-license-1.2.0 points at; the tag stays as the human-readable name for it.
qb-license = { git = "https://github.com/darkkk001/qorebridge.git", rev = "f77a73a6" }
