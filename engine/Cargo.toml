[workspace]
resolver = "2"
members = [
    "protocol",
    "market-data",
    "order-management",
    "position",
    "risk",
    "margin",
    "execution",
    "ledger",
    "server",
    "loadtest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "rust_decimal", "chrono"] }
async-nats = "0.38"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
