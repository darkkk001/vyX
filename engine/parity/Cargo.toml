[package]
name = "parity"
version.workspace = true
edition.workspace = true
description = "Stage 0 parity harness: runs engine/parity/scenarios/*.json through the engine's own calc/risk/margin code (no DB) for comparison with the web path (scripts/parity/run-ts.ts)."

[[bin]]
name = "parity"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
risk = { path = "../risk" }
margin = { path = "../margin" }
order-management = { path = "../order-management" }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sqlx.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
