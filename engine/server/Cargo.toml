[package]
name = "server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "trading-core-server"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
order-management = { path = "../order-management" }
margin = { path = "../margin" }
market-data = { path = "../market-data" }
tokio.workspace = true
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
sqlx.workspace = true
async-nats.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# timeBeginPeriod(1) at startup (src/main.rs request_1ms_timer_resolution); Windows only, so Linux builds never pull it
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Media"] }
