[package]
name = "server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "trading-core-server"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
order-management = { path = "../order-management" }
margin = { path = "../margin" }
market-data = { path = "../market-data" }
tokio.workspace = true
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
sqlx.workspace = true
async-nats.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Constant-time shared-secret compares for the x-internal-secret /
# x-market-data-secret / x-price-feed-secret guards (pentest 2026-09-18
# item 13). Already in Cargo.lock transitively (rustls/ring), so no new
# dependency tree.
subtle = "2"
